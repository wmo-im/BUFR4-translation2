[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docling-check"
version = "0.1.0"
description = "Cross-check PDF table extraction against Docling's AI-based table detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pandas>=2.0",
    "docling>=2.0",
]

[project.scripts]
docling-check = "docling_check:main"

[project.urls]
# Homepage = "https://github.com/YOUR_USERNAME/docling-check"  # update before publishing

[tool.hatch.build.targets.wheel]
only-include = ["docling_check.py"]

[tool.hatch.build.targets.sdist]
only-include = ["docling_check.py", "README.md", "FINDINGS.md", "pyproject.toml"]
